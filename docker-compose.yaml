services:
  app1:
    build: "./server"
    init: true
    environment:
      NODE_ID: "node-1"

  app2:
    build: "./server"
    init: true
    environment:
      NODE_ID: "node-2"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
